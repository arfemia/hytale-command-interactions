plugins {
    id 'java'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// The -javadoc jar is a release artifact, not a build check: `build` leaves it (and the javadoc run
// behind it) out, `gradlew build -Prelease` builds it with everything else, and naming javadocJar
// builds it alone.
if (!providers.gradleProperty('release').map { it != 'false' }.getOrElse(false)) {
    tasks.named('assemble') {
        setDependsOn(dependsOn.findAll { !((it instanceof Task || it instanceof TaskProvider) && it.name == 'javadocJar') })
    }
}

group = project.group
version = project.version

repositories {
    mavenCentral()
}

// Compile against the SAME jar the server runs. ZERO other dependencies (no
// ziggfreed-common, no MMO jar) - a deliberate maintainer decision for a single-jar
// CurseForge install. In a workspace, its family.properties (at workspaceRoot) names
// hytaleHome, patchline and game_build once for every family build; built alone, with no
// family.properties there, this repo's gradle.properties gives them (these locals shadow
// the gradle.properties values of the same names for the rest of this script). HYTALE_HOME
// (env var) overrides either hytaleHome, so a fresh clone on another machine can build
// without editing a tracked file; either way, fail configuration explicitly with a clear
// message rather than let a missing jar surface as hundreds of unresolved-symbol
// compile errors with no hint of the cause. family.properties is read through
// providers.fileContents, so the configuration cache tracks it, its absence included.
def familyBuildKeys = new Properties()
def familyBuildKeysBytes = providers.fileContents(rootProject.layout.projectDirectory.file("${workspaceRoot}/family.properties")).asBytes.orNull
if (familyBuildKeysBytes != null) {
    familyBuildKeys.load(new StringReader(new String(familyBuildKeysBytes, 'UTF-8')))
}
def buildKey = { String key -> familyBuildKeys.getProperty(key)?.trim() ?: property(key).toString() }
def hytaleHome = buildKey('hytaleHome')
def patchline = buildKey('patchline')
def game_build = buildKey('game_build')
def resolvedHytaleHome = System.getenv('HYTALE_HOME') ?: hytaleHome
def hytaleServerJar = new File("${resolvedHytaleHome}/${patchline}/package/game/${game_build}/Server/HytaleServer.jar")
if (!hytaleServerJar.exists()) {
    throw new GradleException(
            "HytaleServer.jar not found at ${hytaleServerJar}. Set the HYTALE_HOME environment " +
            "variable to your Hytale install directory, or edit 'hytaleHome' in the workspace's " +
            "family.properties (in gradle.properties when this repo is built alone).")
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 requires the JUnit Platform launcher on the test runtime classpath.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The Hytale server jar is provided at runtime (the server loads it first), so we
    // NEVER bundle it - bundling would double-load engine classes under two classloaders.
    compileOnly(files(hytaleServerJar))

    // Tests are engine-free by design (GateLogicTest/PlaceholdersTest import only JUnit
    // and java.util): forcing RunCommandInteraction.CODEC's class-init outside a live
    // server throws (see the class javadoc), so no test touches the engine jar and it
    // is deliberately NOT on the test classpath.
}

// Never call a deprecated engine API (family-wide rule, the workspace's
// .claude/rules/java-conventions.md): -Xlint:removal surfaces every Hytale API annotated @Deprecated(forRemoval = true)
// still in use, and -Werror promotes that warning to a hard compile failure, mirroring the MMO
// jar's own compileJava flag. A future Hytale server update that deprecates-for-removal an API
// this mod calls will now fail the build on sight instead of silently degrading toward a removed
// API. compileJava only (not compileTestJava), matching the MMO jar's own scoping. A plain
// @Deprecated call compiles green here: gradle/deprecation-gate.gradle, applied below and run by
// `check`, compiles every source set again with -Xlint:deprecation and fails on any such call not
// marked "// DEPRECATION-KEPT: <why>" (that flag stays off compileJava, whose -Werror would fail a
// marked call too). The gate file is the MMO's (mmo-family/mmo-skills), copied byte for byte:
// change it there and copy it here.
compileJava {
    options.compilerArgs << '-Xlint:removal' << '-Werror'
}

apply from: "$rootDir/gradle/deprecation-gate.gradle"

test {
    useJUnitPlatform()
    // ExamplePackManifestTest reads the example pack's manifest.json from its source folder, off
    // the classpath, so it is declared here: otherwise an edit to that file alone leaves :test
    // UP-TO-DATE and the drift the test exists to catch passes the build.
    inputs.file('examples/InteractionCommandsExamples/manifest.json')
            .withPropertyName('examplePackManifest')
            .withPathSensitivity(PathSensitivity.NONE)
}

// Every test JVM: a 512 MB heap, the serial collector and C1-only compilation, which start fastest
// for a JVM that lives seconds, never long enough for C2 or a parallel GC to pay off.
tasks.withType(Test).configureEach {
    maxHeapSize = '512m'
    jvmArgs '-XX:+UseSerialGC', '-XX:TieredStopAtLevel=1'
    // Never from the build cache: a test can read an input no task declares, and a -D generator run
    // writes files that are no task's output, so only a real run proves it. UP-TO-DATE still skips
    // a test task whose declared inputs are unchanged.
    outputs.cacheIf('tests read undeclared inputs') { false }
}

processResources {
    var expandProps = [
            'name'           : project.name,
            'version'        : project.version,
            'group'          : project.group,
            'mod_description': project.findProperty('mod_description') ?: '',
            'website'        : project.findProperty('website') ?: '',
            'entry_point'    : project.findProperty('entry_point') ?: ''
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
