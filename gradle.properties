group=Ziggfreed
name=InteractionCommands
version=1.1.1
java_version=25
mod_description=Adds a RunCommand interaction step that runs configured server or player commands from any interaction chain, with placeholders, cooldowns, chance rolls, and permission gates.
website=https://github.com/arfemia/hytale-command-interactions
game_build=latest
entry_point=com.ziggfreed.interactioncommands.InteractionCommandsPlugin

# Compile against the SAME jar the server runs (path built from
# hytaleHome/patchline/game_build in build.gradle). In a workspace, its family.properties'
# keys of the same names replace these; these values serve a build of this repo alone.
hytaleHome=D:/Games/Hytale/install
patchline=pre-release

# The workspace root, relative to this project dir: the folder whose family.properties maps every
# family repo and pack to its path. This build reads no sibling; the family's consumers resolve
# this repo through that map.
workspaceRoot=../..

# Gradle itself, the same in every family repo so one daemon serves them all (a different value
# here starts a second daemon): projects build in parallel, task outputs go to the build cache
# (its folder is set in settings.gradle), a run whose build scripts and the files they read are
# unchanged reuses the configuration cache instead of configuring again, and an idle daemon exits
# after 30 minutes.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=1800000
